<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Hong Kong parking meters and carparks with live vacancy." />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MikeBill" />
    <meta name="application-name" content="MikeBill" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

    <link
      rel="apple-touch-startup-image"
      href="/icons/icon-512.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/icon-512.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/icon-512.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />

    <title>MikeBill</title>

    <!-- Map GitHub Pages ?/path redirects onto hash routes (#/path). -->
    <script>
      (function () {
        var search = window.location.search;
        if (!(search && search.charAt(1) === '/')) return;

        // Example: ?/locate&lat=1&lng=2  →  #/locate?lat=1&lng=2
        var parts = search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&');
        });
        var path = parts[0] || '/';
        if (path.charAt(0) !== '/') path = '/' + path;
        var query = parts.slice(1).join('&');
        var hash = '#' + path + (query ? '?' + query : '');
        window.location.replace(window.location.pathname + hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MikeBill requires JavaScript to display the parking map.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
